<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>看板</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <style>
    html, body { margin: 0; min-height: 100%; background: #080b12; color: #f5f7fb; }
    .startup { font-family: system-ui, "Microsoft YaHei", sans-serif; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
    .startup h1, .startup p { margin: 0; }
    .startup p { color: #b6c1d6; }
    .startup a { color: #7ee9ff; }
    .startup button { padding: 10px 18px; border: 1px solid #7ee9ff; border-radius: 8px; color: #f5f7fb; background: #161d2c; cursor: pointer; }
  </style>
  <link id="app-styles" rel="stylesheet" href="/static/css/app.css" media="print">
  <link rel="modulepreload" href="/static/js/app.js">
  <link rel="modulepreload" href="/static/js/api.js">
  <link rel="modulepreload" href="/static/js/dnd.js">
  <link rel="modulepreload" href="/static/js/format.js">
  <link rel="modulepreload" href="/static/js/icons.js">
</head>
<body>
  <div id="app">
    <section class="startup" aria-live="polite">
      <h1>看板</h1>
      <p id="startup-message" role="status">正在连接，马上回来…</p>
      <a href="">重新加载</a>
      <noscript><p>请启用 JavaScript 后重新加载看板。</p></noscript>
    </section>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts"></div>
  <script type="module" src="/static/js/startup.js"></script>
</body>
</html>
